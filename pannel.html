.___layout {

.layout-desktop {
    display: flex;
background-color: aliceblue;

.layout-phone {

.nav {
    position: fixed;
    --padding: calc((var(---page--CW) + var(---page--CH)) / 150);
    width: calc(var(---page--CW) - (var(--padding) * 4));
    height: calc(var(---page--CH) / 15);
    background: linear-gradient(to right , rgb(36, 115, 218) , rgb(86, 144, 219));
    padding: var(--padding);
    margin: var(--padding) 0;
    border-radius: var(--circle_radius);
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: +999;
}
.nav button {
    position: relative;
border: none;
outline: none;
background-color: transparent;
padding: calc(var(--padding) / 2);
margin: 0 calc(var(--padding) / 1.5);
border-radius: var(--circle_radius);
cursor: pointer;
overflow: hidden;
}
.nav button::after {
content: "";
position: absolute;
left: 50%;
top: 50%;
transform: translate(-50% , -50%);
height: 100%;
width: 100%;
opacity: 0;
transition: opacity 100ms;
}
.nav button i {
    position: relative;
    z-index: +1;
    font-size: calc(var(--padding) * 1.3);
}
.nav button:hover::after {
    opacity: 0.5 !important;
}
.nav .theme-toggle .dark {
    
    color: rgb(68, 67, 67);
}
.nav .theme-toggle .dark::after {
    background-color: rgb(68, 67, 67);
}
.nav .theme-toggle .light {
    
    color: rgb(68, 67, 67);
}
.nav .theme-toggle .light::after {
    background-color: white;
}
.layout-desktop  ._light--active .light::after {
opacity: 1 !important;

}
.layout-desktop  ._light--active .dark::after {
opacity: 0;
}
.layout-desktop  ._dark--active .light::after {
opacity: 0;
}
.layout-desktop  ._dark--active .light {
color: white;
}
.layout-desktop  ._dark--active .dark::after {
opacity: 1 !important;
}
.layout-desktop  ._dark--active .dark {
color: white;
}

    color: white;
}
.input-text {
